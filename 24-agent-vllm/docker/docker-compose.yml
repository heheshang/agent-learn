# vLLM 服务 —— OpenAI 兼容的推理服务
#
# ⚠️ ★ **前置条件：NVIDIA GPU + Linux**
#
# vLLM 官方镜像**只支持 Linux + CUDA** ——
# 它基于 PyTorch 的 CUDA 构建，在 macOS（哪怕是 Apple Silicon）上跑不了。
#
# 本仓库的开发机是 Apple M1 Max（ARM64 macOS，无 CUDA），
# 所以「真 vLLM」这条轨**只能**在带 NVIDIA GPU 的 Linux 机器上跑。
#
# 没有 GPU 时，用项目内置的 mock 服务：
#   make mock        # 模拟一个「延迟行为像连续批处理」的 OpenAI 兼容服务
#
# ── 启动 ──────────────────────────────────────────────────────────────
#   docker compose -f docker/docker-compose.yml up -d
#
# ⚠️ `--ipc=host` 是**必须的** ——
#    vLLM 用 PyTorch 的共享内存在多进程间传张量（张量并行时尤其重要），
#    Docker 默认的 64MB 共享内存**远远不够**，会报
#    「DataLoader worker ... bus error」或 CUDA 初始化失败。

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: agent-learn-vllm
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # ⚠️ HF token —— 拉取 Llama 3 / Qwen 等**需要授权**的模型时必须提供。
      #    不需要授权的模型（Qwen2.5、Llama 3.2 等）可以留空。
      - HF_TOKEN=${HF_TOKEN:-}
    ports:
      # 宿主 8000 → 容器 8000（vLLM 的默认端口）。
      - "8000:8000"
    volumes:
      # 模型缓存挂到宿主 —— 否则每次重建容器都要重下几十 GB。
      - "${HOME}/.cache/huggingface:/root/.cache/huggingface"
    # ⚠️ 必须：共享内存要够大（PyTorch 多进程传张量）。
    ipc: host
    # ⚠️ `--gpus all` 等价于上面的 runtime: nvidia。
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}"
      # 对外暴露的模型名 —— 客户端 `--model` 要用这个。
      - "--served-model-name"
      - "${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}"
      # ★ 服务端同时处理的序列数上限 —— **批处理优化的核心旋钮**。
      #   调大 → 批更满 → 吞吐更高，但单请求延迟变差。
      - "--max-num-seqs"
      - "${VLLM_MAX_NUM_SEQS:-16}"
      # ★ 单个 forward 的 token 预算 —— 限制一次前向的算力开销。
      - "--max-num-batched-tokens"
      - "${VLLM_MAX_BATCHED_TOKENS:-2048}"
      # ★ 长 prompt 切块 —— 避免一条超长 prompt 霸占整个 forward，
      #   把正在 decode 的请求全卡住（head-of-line blocking）。
      - "--enable-chunked-prefill"
      # ★ 显存利用率 —— 决定能开多大的批。
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEM_UTIL:-0.9}"
      # ⚠️ 关掉模型自带的 generation_config，
      #    否则采样参数会被模型仓库里的默认值覆盖（压测需要可控）。
      - "--generation-config"
      - "vllm"
    healthcheck:
      # ⚠️ 健康检查必须打 `/v1/models` —— 那是**不消耗算力**的只读接口。
      #    打 `/v1/chat/completions` 会真的跑一次推理，白白占用 GPU。
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/models || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    restart: unless-stopped

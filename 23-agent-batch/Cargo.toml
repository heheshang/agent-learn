[package]
name = "agent-23"
version = "0.1.0"
edition = "2024"

[dependencies]
agent-logging = { path = "../00-logging" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# ── 批处理并发原语 ────────────────────────────────────────────────────
# `futures`：本项目的**核心**依赖。
#
# 只开 `std`（不要 `async-await`）——
# `async-await` feature 会给所有 future 加 `Send` 约束要求，
# 而本项目需要的是**就地组合**的并发原语
# （`join_all` / `FuturesUnordered` / `buffer_unordered`）。
#
# ⚠️ 为什么不用 `tokio::spawn`：
#    `spawn` 要求 future 是 `'static`（不借用调用栈上的数据），
#    而本项目的批任务要借用 `&BatchEmbedder` / `&[String]`，
#    只能靠 `join_all` 这类**就地组合**的并发原语。
futures = { workspace = true }

# ── HTTP API 层 ──────────────────────────────────────────────────────
axum = { workspace = true }
tower-http = { workspace = true }

# tower：测试里用 `ServiceExt::oneshot` 直接调 axum 路由。
tower = { workspace = true }

# 远程批量 embedding 服务（真 HTTP，用于对照实验）
reqwest = { workspace = true }

# ── 模型推理 ─────────────────────────────────────────────────────────
# fastembed：本地 ONNX 推理引擎。
#
# ⚠️ 版本与 workspace 锁定一致（4.9.1）——
#    5+ 依赖 `ort =2.0.0-rc.15`，4.x 依赖 `ort =2.0.0-rc.9`，
#    两者在同一 workspace 里会冲突（ort 用的是精确版本约束）。
fastembed = { workspace = true }

# ── 复用 05（嵌入模型 / 缓存目录）/ 08（重排模型 / 候选块）─────────
#
# - `rag_05::embed::{Embedder, LocalEmbedder, Model, cache_dir}`
#   —— 本项目的**对照组**：逐条调用的基线嵌入器
# - `rag_08::reranker::{Reranker, RerankDocument, RerankedHit, RerankerModel}`
#   —— 候选块与重排结果的数据模型
rag-05 = { path = "../05-rag" }
rag-08 = { path = "../08-rag" }

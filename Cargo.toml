[workspace]
resolver = "3"
members = [
    "00-logging",
    "01-axum",
    "02-rig",
    "03-genai",
    "04-rag",
    "05-rag",
    "06-rag",
    "07-query",
    "08-rag",
    "09-rag-eval",
    "10-rag-milvus",
    "11-rag-advance",
    "12-rag-summary",
    "13-agent-core",
    "14-agent-tool",
    "15-agent-sql",
    "16-agent-function-calling",
    "17-agent-memory",
    "18-agent-error",
    "19-agent-summary",
    "20-agent-preformence-analysis",
    "21-agent-cache",
    "22-agent-async",
]

# 所有成员 crate 的依赖都在这里统一定义，成员用 `dep = { workspace = true }` 引用。
# 版本与 feature 只在此处出现一处，避免各模块之间版本漂移。
[workspace.dependencies]
# ── 通用基础库 ───────────────────────────────────────────────────────
anyhow = "1.0.104"
thiserror = "2.0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

# ── 00-logging（workspace 共享日志设施）───────────────────────────────
# tracing：结构化日志的「发射端」——所有 `info!` / `debug!` 宏都来自它。
#
# tracing-subscriber：「接收端」——负责把事件格式化后输出。
# `env-filter` feature 提供 `EnvFilter`，让 `RUST_LOG` 环境变量
# 能按模块粒度过滤级别（这是 `println!` 做不到的）。
# `fmt` feature 提供 `fmt::Layer`；`chrono` feature 提供本地时区时间戳。
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "fmt",
    "ansi",
    "chrono",
] }

# ── 01-axum / 06-rag ───────────────────────────────────────────────
# `macros` feature 提供 `#[axum::debug_handler]` —— 写 handler 时它能
# 在编译期给出精确的 trait bound 诊断（哪个 future 不是 Send），
# 否则 axum 只会报一句笼统的「Handler trait 未实现」。
axum = { version = "0.8.9", features = ["macros"] }

# ── 02-rig ──────────────────────────────────────────────────────────
rig = "0.46"

# ── 03-genai ────────────────────────────────────────────────────────
# `rust-genai-agent` 依赖的是 AgentPrism fork 的 genai（lib 名仍叫 `genai`）。
# 必须与它指向同一个包，否则 `genai::` 类型与 agent crate 的类型不互通。
genai = { version = "=0.7.0-beta.19.1-agentprism", package = "genai-agentprism" }
rust-genai-agent = "0.2.0"

# ── 04-rag ──────────────────────────────────────────────────────────
# Docling：Rust 版 docling，结构感知解析（PDF/HTML/DOCX → DoclingDocument），
# 自带 heading-aware chunker。这是本项目的主 loader。
#
# `pdf-text` 只抽文本层，不做版面分析 —— 快、零额外模型依赖，
# 但标题不会变成 `#`。
# 想要标题层级（PDF → `## Section 1 ...`），在 04-rag 里启用 layout feature：
#   cargo run --features layout
# 它会打开 docling 的完整 PDF ML 管线（ONNX runtime），
# 并需要额外下载版面模型（见 04-rag/README.md「可选：版面分析」）。
docling = { version = "2.67", default-features = false, features = [
    "chunking",
    "pdf-text",
] }

# 纯 Rust 的 PDF 文本抽取，作为「无依赖基线」对照实现。
pdf-extract = "0.12"

# Markdown 解析：自己实现结构感知分块时用。
pulldown-cmark = "0.13"

# 通用字符/词级递归分块器（LlamaIndex SentenceSplitter 的对应物）。
text-splitter = { version = "0.33", features = ["markdown", "tiktoken-rs"] }

# Token 精确计数：用真实 tokenizer 而不是估算字符数。
tiktoken-rs = "0.12"

# ── 05-rag ──────────────────────────────────────────────────────────
# fastembed：本地 ONNX 推理引擎，跑 sentence-transformers 系的嵌入模型。
# 优势：无 Python 依赖、无 API key、模型自动下载到本地缓存。
#
# ⚠️ 版本锁定在 4.x：rig 0.46 依赖的 `rig-fastembed` 需要 fastembed ^4.5，
# 而 fastembed 5+ 依赖 `ort =2.0.0-rc.15`，4.x 依赖 `ort =2.0.0-rc.9`。
# 两个版本在同一个 workspace 里会冲突（ort 用的是精确版本约束）。
fastembed = "4.9.1"

# FAISS：Facebook AI Similarity Search，Rust 绑定。
# 默认走动态链接 —— 需要系统装好 libfaiss_c（macOS: `brew install faiss`）。
# 静态链接（features = ["static"]）会在编译期用 cmake 源码构建 FAISS，
# 需要 cmake + OpenMP + BLAS，构建非常慢。
faiss = "0.13.0"

# Chroma 的 Rust HTTP 客户端。
chromadb = "2.3.0"

# 直接调 Chroma 的 HTTP API —— `chromadb` crate 的 `create_collection`
# 还不支持 `configuration` 参数（没法指定距离空间），只能自己发请求。
reqwest = { version = "0.11", default-features = false, features = [
    "json",
    "rustls-tls",
] }

# ── 06-rag ──────────────────────────────────────────────────────────
# tower-http：axum 的中间件生态（请求体大小限制、超时、追踪、CORS）。
# `timeout` feature 提供 `TimeoutLayer` —— 给 LLM 调用加超时必须有，
# 否则 DeepSeek 挂起会让整个 HTTP 请求一直挂着。
# `cors` feature 提供 `CorsLayer` —— 前后端分离部署时需要。
tower-http = { version = "0.6", features = [
    "timeout",
    "limit",
    "trace",
    "cors",
] }

# 临时目录：测试里造知识库用。
tempfile = "3.23"

# ── 10-rag-milvus ───────────────────────────────────────────────────
# tower：`ServiceExt::oneshot` —— 集成测试里直接调 axum 路由，
# 不必真起一个 HTTP 服务器。
tower = { version = "0.5", features = ["util"] }

# Milvus 官方 Rust SDK。v2 API（ClientV2 + request/response builder）是
# 当前主线，v1 仅作兼容保留 —— 新代码一律用 v2。
#
# ⚠️ 它内部用 `tonic 0.13` + `prost 0.13`，且 build.rs 依赖
#    `protoc-bin-vendored`（自带 protoc，不用系统装）。
milvus-sdk-rust = "3.0.3"

# Qdrant 官方 Rust SDK（Milvus 的横向对照对象）。
# 同样 gRPC + HNSW + payload 过滤 + 混合检索。
qdrant-client = "1.20.0"

# SHA-1：只用来派生 UUIDv5（Qdrant 的 point id 必须是整数或 UUID）。
# 这里不是拿它做安全用途 —— 是借用它「确定性哈希」这一个性质。
sha1 = "0.10"

# SHA-256：缓存键的内容寻址哈希（21-agent-cache）。
#
# ⚠️ 不能用 `std::collections::hash_map::DefaultHasher`：
# 它的输出**不保证跨进程/跨版本稳定**，而且 seed 随机 ——
# 重启一次所有缓存键全变，缓存永远命中不了。
# SHA-256 是**内容寻址**：同样的输入永远得到同样的键。
sha2 = "0.10"

# ── 15-agent-sql ───────────────────────────────────────────────────
# rusqlite：SQLite 的 Rust 绑定。
#
# `bundled` feature 把 SQLite 源码编译进来 ——
# 不依赖系统装 libsqlite3，换机器就能跑（对「学习项目」很重要）。
rusqlite = { version = "0.41", features = ["bundled"] }

# ── 17-agent-memory ───────────────────────────────────────────────────
# chrono：给记忆文件打日期（`daily/YYYY-MM-DD.md`）和记录时间戳。
# 只开 `clock` + `std` —— 不要 `serde`（我们自己用 serde_json 序列化状态）。
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
] }

# ── 11-rag-advance ──────────────────────────────────────────────────
# docling-pdf：docling 的 PDF 后端，单独引一份是为了直接用它的
# **文本层几何**（每个词/行/单元格的坐标框）。
#
# 完整 ML 管线（版面分析 + TableFormer + OCR）要跑 ONNX，
# 且 docling-onnx 要求 `ort =2.0.0-rc.14`，而 fastembed 4.9.1
# 锁的是 `ort =2.0.0-rc.9`（精确版本约束）—— 两者同 workspace 会冲突。
#
# 所以本项目走**纯几何路线**：不跑模型，用坐标把表格/图片还原出来。
# `ocr-prep` feature 只开 `dep:image`（不引入 ort），代价极小。
docling-pdf = { version = "2.67.1", default-features = false, features = [
    "ocr-prep",
] }

# lopdf：纯 Rust 的 PDF 对象模型。用来直接读 PDF 里的图片 XObject
# （docling 的文本层路径不吐图片）。
#
# ⚠️ 版本要和 docling-pdf 对齐（0.45），否则 workspace 里会有两份 lopdf。
lopdf = { version = "0.45", default-features = false }

# PNG 编码：把 PDF 里的位图转成 PNG 落盘。
png = "0.17"

# base64：把图片编码成 data URL，喂给支持多模态的 LLM。
base64 = "0.22"

# ── 22-agent-async ───────────────────────────────────────────────────
# futures：本项目的**核心**依赖。
#
# 只开 `std`（不要 `async-await`）——
# `async-await` feature 会给所有 future 加 `Send` 约束要求，
# 而本项目需要的是**就地组合**的并发原语（`join_all` /
# `FuturesUnordered` / `buffer_unordered`），它们在 `std` 下就够用。
#
# ⚠️ 为什么不用 `tokio::spawn`：
#    `spawn` 要求 future 是 `'static`（不借用调用栈上的数据），
#    而本项目的工具调用要借用 `&ToolRegistry` / `&str` 提示词，
#    只能靠 `join_all` 这类**就地组合**的并发原语。
futures = { version = "0.3.34", default-features = false, features = [
    "std",
] }

# ── 属性测试 / 模糊测试 ───────────────────────────────────────────────
# proptest：**属性测试**（property-based testing）框架。
#
# 与普通单元测试的区别：
# - 单元测试：「输入 X 应该得到 Y」—— 需要人想出 X
# - 属性测试：「任意输入都满足性质 P」—— 人只写性质，随机输入由框架生成，
#   失败时**自动收缩（shrink）**成最小反例
#
# 本仓库用它做**解析器 / 校验器 / 缓存键**这类
# 「输入完全不可信」的纯函数的不变量测试。
#
# ⚠️ `default-features = false` + 只开 `std`：
#   proptest 的 `fork` / `timeout` feature 依赖 `fork` crate（Unix only），
#   会引入额外的平台耦合；本仓库不需要。
proptest = { version = "1.12.0", default-features = false, features = [
    "std",
] }
